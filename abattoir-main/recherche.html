<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recherche globale - SMTG</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="api/supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#172033}.page{max-width:1450px;margin:auto;padding:24px}.header{display:flex;align-items:center;gap:13px;margin-bottom:20px}.icon{width:48px;height:48px;border-radius:13px;background:#eaf1ff;color:#2457c5;display:flex;align-items:center;justify-content:center;font-size:21px}h1{margin:0;font-size:25px}.sub{margin-top:4px;color:#7a8496;font-size:13px}.search-card,.card,.quick{background:#fff;border:1px solid #e4e9f1;border-radius:16px}.search-card{padding:18px;margin-bottom:18px}.search{position:relative}.search>i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#98a2b3}.search input{width:100%;height:52px;padding:0 45px;border:1px solid #d7dee9;border-radius:11px;outline:0;font-size:14px}.search input:focus{border-color:#7192dc;box-shadow:0 0 0 4px rgba(36,87,197,.08)}.clear{position:absolute;right:9px;top:10px;width:32px;height:32px;border:0;background:transparent;border-radius:8px;color:#98a2b3;display:none;cursor:pointer}.clear:hover{background:#f1f4f8}.info,.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.info{margin-top:11px;color:#667085;font-size:12px}.card{overflow:hidden}.results-head{padding:15px 18px;border-bottom:1px solid #edf0f5}.results-title{font-size:14px;font-weight:700}.count{font-size:12px;color:#667085}.results{padding:12px}.result{width:100%;display:flex;align-items:center;gap:14px;padding:14px;border:1px solid transparent;border-radius:12px;background:#fff;cursor:pointer;text-align:left;margin-bottom:5px}.result:hover{background:#f7f9fc;border-color:#e3e8f0}.result-icon{width:43px;height:43px;flex:none;border-radius:11px;background:#eef3ff;color:#2457c5;display:flex;align-items:center;justify-content:center}.content{min-width:0;flex:1}.name{font-size:14px;font-weight:700;color:#1d2939;margin-bottom:4px}.meta{display:flex;flex-wrap:wrap;gap:7px;color:#8a94a6;font-size:11px}.module{background:#f1f4f8;padding:3px 7px;border-radius:6px}.arrow{color:#98a2b3}.empty{padding:55px 20px;text-align:center;color:#98a2b3}.empty i{display:block;font-size:40px;margin-bottom:12px}.empty strong{display:block;color:#667085;font-size:14px;margin-bottom:5px}.empty span{font-size:12px}.quick{margin-top:18px;padding:17px 18px}.quick-title{font-size:13px;font-weight:700;margin-bottom:12px}.quick button{border:1px solid #dce2eb;background:#fff;border-radius:9px;padding:8px 11px;color:#475467;cursor:pointer;font-size:12px;margin:0 5px 5px 0}.toast{position:fixed;right:20px;bottom:20px;background:#c62828;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:9999;font-size:13px}.toast.show{display:block}mark{background:#fff0a8;border-radius:3px;padding:0 2px}@media(max-width:600px){.page{padding:13px}h1{font-size:22px}.info{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="page">
<div class="header"><div class="icon"><i class="fa-solid fa-magnifying-glass"></i></div><div><h1>Recherche globale</h1><div class="sub">Rechercher rapidement dans les pages accessibles</div></div></div>
<div class="search-card"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="searchInput" type="text" autocomplete="off" autofocus placeholder="Rechercher une page..."><button id="clearBtn" class="clear" title="Effacer"><i class="fa-solid fa-xmark"></i></button></div><div class="info"><span id="status">Toutes les pages accessibles</span><span id="counter">0 résultat</span></div></div>
<div class="card"><div class="results-head"><div class="results-title"><i class="fa-regular fa-file-lines"></i> Pages</div><div class="count" id="headCount">0</div></div><div id="results" class="results"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><div>Chargement des pages...</div></div></div></div>
<div class="quick"><div class="quick-title"><i class="fa-solid fa-clock-rotate-left"></i> Accès rapide</div><button data-search="Tableau de bord">Tableau de bord</button><button data-search="Notifications">Notifications</button><button data-search="Calendrier">Calendrier</button></div>
</div><div id="toast" class="toast"></div>
<script>
"use strict";
let client,currentUser,pages=[];
const $=id=>document.getElementById(id);
document.addEventListener("DOMContentLoaded",init);
async function init(){try{client=getSupabase();currentUser=getCurrentUser();if(!currentUser?.id){showToast("Session utilisateur introuvable.");setTimeout(()=>window.top.location.href="login.html",1000);return}$("searchInput").addEventListener("input",search);$("clearBtn").addEventListener("click",clearSearch);document.querySelectorAll("[data-search]").forEach(b=>b.addEventListener("click",()=>setSearch(b.dataset.search)));await loadPages()}catch(e){console.error(e);showToast(e.message||"Erreur de chargement.")}}
function getCurrentUser(){try{const raw=sessionStorage.getItem("smtg_current_user")||localStorage.getItem("smtg_current_user")||sessionStorage.getItem("smtgUser")||localStorage.getItem("smtgUser");return raw?JSON.parse(raw):null}catch{return null}}
async function loadPages(){try{const {data,error}=await client.from("v_user_effective_pages").select("page_id,page_name,page_code,page_path,module,icon,description,sort_order,is_menu,is_active,can_view").eq("user_id",currentUser.id).eq("can_view",true).eq("is_active",true).order("sort_order",{ascending:true});if(error)throw error;pages=(data||[]).filter(p=>p.page_name&&p.page_path&&p.page_code);render(pages)}catch(e){console.error(e);$("results").innerHTML='<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><strong>Impossible de charger les pages</strong><span>'+esc(e.message||"")+'</span></div>'}}
function search(){const v=$("searchInput").value.trim();$("clearBtn").style.display=v?"block":"none";if(!v){$("status").textContent="Toutes les pages accessibles";render(pages);return}const q=v.toLowerCase();const list=pages.filter(p=>String(p.page_name||"").toLowerCase().includes(q));$("status").textContent='Recherche : "'+v+'"';render(list)}
function setSearch(v){$("searchInput").value=v;search();$("searchInput").focus()}
function clearSearch(){$("searchInput").value="";$("clearBtn").style.display="none";$("status").textContent="Toutes les pages accessibles";render(pages);$("searchInput").focus()}
function render(list){$("counter").textContent=list.length+" "+(list.length>1?"résultats":"résultat");$("headCount").textContent=list.length;const box=$("results");if(!list.length){box.innerHTML='<div class="empty"><i class="fa-solid fa-magnifying-glass"></i><strong>Aucune page trouvée</strong><span>Essayez avec un autre nom de page.</span></div>';return}box.innerHTML="";const q=$("searchInput").value.trim();list.forEach(p=>{const b=document.createElement("button");b.className="result";b.type="button";b.innerHTML='<div class="result-icon"><i class="'+esc(p.icon||"fa-solid fa-file-lines")+'"></i></div><div class="content"><div class="name">'+highlight(p.page_name,q)+'</div><div class="meta"><span class="module">'+esc(p.module||"Général")+'</span><span>'+esc(p.page_path)+'</span></div></div><div class="arrow"><i class="fa-solid fa-chevron-right"></i></div>';b.onclick=()=>openPage(p);box.appendChild(b)})}
function openPage(p){if(!p?.page_path)return;try{if(window.top&&window.top!==window){const frame=window.top.document.getElementById("pageFrame");if(frame){frame.src=p.page_path;return}}}catch(e){console.warn(e)}window.location.href=p.page_path}
function highlight(name,q){let s=esc(name||"");if(!q)return s;return s.replace(new RegExp("("+escReg(q)+")","gi"),"<mark>$1</mark>")}
function escReg(v){return String(v).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function showToast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove("show"),3500)}
window.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("searchInput").focus()}if(e.key==="Escape"&&$("searchInput").value)clearSearch()});
</script>
</body>
</html>
