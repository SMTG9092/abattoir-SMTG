<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#075B35"
    >

    <title>SMTG - Connexion</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            overflow: hidden;
        }


        body {

            background-color: #b8bec5;

            background-image:
                linear-gradient(
                    rgba(4, 24, 45, 0.18),
                    rgba(4, 24, 45, 0.18)
                ),
                url("./img/login-bg.png");

            background-position:
                center center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

            background-attachment:
                fixed;

            min-height:
                100vh;

            position:
                relative;
        }


        .login-container {

            position:
                absolute;

            inset:
                0;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                20px;

            z-index:
                10;
        }


        .login-card {

            width:
                400px;

            max-width:
                94vw;

            padding:
                30px 32px 25px;

            background:
                rgba(248, 251, 254, 0.96);

            border:
                1px solid
                rgba(255, 255, 255, 0.90);

            border-radius:
                18px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.30);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            position:
                relative;
        }


        .logo-container {

            text-align:
                center;

            margin-bottom:
                18px;
        }


        .logo {

            width:
                165px;

            max-width:
                75%;

            height:
                auto;

            display:
                block;

            margin:
                0 auto;
        }


        .login-title {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

            margin-top:
                12px;

            margin-bottom:
                22px;

            color:
                #285A42;

            font-size:
                15px;

            font-weight:
                500;

            white-space:
                nowrap;
        }


        .login-title::before,
        .login-title::after {

            content:
                "";

            height:
                1px;

            background:
                #C8DCD0;

            flex:
                1;
        }


        .input-group {

            width:
                100%;

            height:
                54px;

            display:
                flex;

            align-items:
                center;

            background:
                rgba(255, 255, 255, 0.95);

            border:
                1px solid
                #D4E5DB;

            border-radius:
                10px;

            overflow:
                hidden;

            margin-bottom:
                12px;

            transition:
                0.2s ease;
        }


        .input-group:focus-within {

            border-color:
                #16804A;

            box-shadow:
                0 0 0 3px
                rgba(22, 128, 74, 0.10);
        }


        .input-icon {

            width:
                48px;

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            color:
                #075B35;

            border-right:
                1px solid
                #E4EEE8;

            flex-shrink:
                0;
        }


        .input-icon svg {

            width:
                21px;

            height:
                21px;

            stroke:
                currentColor;
        }


        .input-group input {

            width:
                100%;

            height:
                100%;

            border:
                none;

            outline:
                none;

            background:
                transparent;

            padding:
                0 14px;

            font-size:
                14px;

            color:
                #173D2A;
        }


        .input-group input::placeholder {

            color:
                #809B8B;
        }


        .password-toggle {

            width:
                48px;

            height:
                100%;

            border:
                none;

            background:
                transparent;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            cursor:
                pointer;

            color:
                #4E735E;

            flex-shrink:
                0;
        }


        .password-toggle:hover {

            color:
                #075B35;
        }


        .password-toggle svg {

            width:
                20px;

            height:
                20px;

            stroke:
                currentColor;
        }


        .options {

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            margin:
                5px 2px 18px;

            font-size:
                11px;
        }


        .remember {

            display:
                flex;

            align-items:
                center;

            gap:
                6px;

            color:
                #4A6C58;

            cursor:
                pointer;

            user-select:
                none;
        }


        .remember input {

            width:
                14px;

            height:
                14px;

            accent-color:
                #16804A;

            cursor:
                pointer;
        }


        .forgot {

            color:
                #16804A;

            text-decoration:
                none;

            cursor:
                pointer;
        }


        .forgot:hover {

            text-decoration:
                underline;
        }


        .login-button {

            width:
                100%;

            height:
                54px;

            border:
                none;

            border-radius:
                10px;

            background:
                linear-gradient(
                    135deg,
                    #16804A,
                    #064A2C
                );

            color:
                white;

            font-size:
                16px;

            font-weight:
                700;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            gap:
                9px;

            cursor:
                pointer;

            box-shadow:
                0 7px 18px
                rgba(7, 91, 53, 0.25);

            transition:
                0.2s ease;
        }


        .login-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 10px 22px
                rgba(7, 91, 53, 0.32);
        }


        .login-button:active {

            transform:
                translateY(0);
        }


        .login-button:disabled {

            opacity:
                0.65;

            cursor:
                wait;

            transform:
                none;
        }


        .login-button svg {

            width:
                20px;

            height:
                20px;

            stroke:
                currentColor;
        }


        .message {

            min-height:
                20px;

            margin-top:
                10px;

            text-align:
                center;

            font-size:
                11px;

            font-weight:
                600;

            opacity:
                0;

            transition:
                opacity 0.2s ease;
        }


        .message.show {

            opacity:
                1;
        }


        .message.error {

            color:
                #c62828;
        }


        .message.success {

            color:
                #218A4D;
        }


        .message.info {

            color:
                #39735A;
        }


        .card-bottom {

            text-align:
                center;

            margin-top:
                16px;

            padding-top:
                13px;

            border-top:
                1px solid
                #DDEAE1;
        }


        .bottom-title {

            color:
                #315B46;

            font-size:
                12px;

            font-weight:
                600;
        }


        .bottom-subtitle {

            margin-top:
                5px;

            color:
                #809B8B;

            font-size:
                8px;

            letter-spacing:
                2px;
        }


        .date-time {

            position:
                fixed;

            left:
                18px;

            bottom:
                12px;

            color:
                white;

            font-size:
                11px;

            font-weight:
                500;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.60);

            z-index:
                20;
        }


        .version {

            position:
                fixed;

            right:
                18px;

            bottom:
                12px;

            color:
                white;

            font-size:
                10px;

            opacity:
                0.85;

            text-shadow:
                0 2px 5px
                rgba(0, 0, 0, 0.60);

            z-index:
                20;
        }


        .spinner {

            width:
                18px;

            height:
                18px;

            border:
                2px solid
                rgba(255, 255, 255, 0.45);

            border-top-color:
                white;

            border-radius:
                50%;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);
            }
        }


        @media (max-width: 600px) {

            .login-card {

                width:
                    360px;

                padding:
                    25px 23px 21px;
            }


            .logo {

                width:
                    155px;
            }


            .login-title {

                font-size:
                    13px;
            }


            .date-time {

                display:
                    none;
            }


            .version {

                right:
                    10px;

                bottom:
                    8px;
            }
        }


        @media (max-height: 650px) {

            .login-card {

                padding:
                    18px 25px 15px;
            }


            .logo {

                width:
                    125px;
            }


            .logo-container {

                margin-bottom:
                    10px;
            }


            .login-title {

                margin-top:
                    6px;

                margin-bottom:
                    12px;
            }


            .input-group {

                height:
                    47px;

                margin-bottom:
                    9px;
            }


            .options {

                margin-bottom:
                    12px;
            }


            .login-button {

                height:
                    47px;
            }


            .card-bottom {

                margin-top:
                    10px;

                padding-top:
                    8px;
            }
        }

    
        /* =====================================================
           NOM D'UTILISATEUR — TOUJOURS EN MAJUSCULES
           PASSWORD RESTE STRICTEMENT COMME SAISI
        ===================================================== */

        #username {
            text-transform: uppercase;
        }

        #username::placeholder {
            text-transform: uppercase;
        }

    </style>

</head>


<body>


    <main class="login-container">

        <section class="login-card">


            <div class="logo-container">

                <img
                    src="img/logo-smtg.png"
                    alt="SMTG Abattoir"
                    class="logo"
                >

            </div>


            <div class="login-title">

                <span>
                    Système de Gestion Intégré
                </span>

            </div>


            <form
                id="loginForm"
                autocomplete="on"
            >


                <!-- USERNAME -->

                <div class="input-group">

                    <div class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M20 21a8 8 0 0 0-16 0"
                            ></path>

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                            ></circle>

                        </svg>

                    </div>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nom d'utilisateur"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <div class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            ></rect>

                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                            ></path>

                        </svg>

                    </div>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mot de passe"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Afficher le mot de passe"
                    >

                        <svg
                            id="eyeIcon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M2 12s3.5-7 10-7
                                10 7 10 7-3.5 7-10 7
                                S2 12 2 12z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>


                <!-- OPTIONS -->

                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Se souvenir de moi
                        </span>

                    </label>


                    <a
                        href="#"
                        class="forgot"
                        id="forgotPassword"
                    >
                        Mot de passe oublié ?
                    </a>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >

                    <svg
                        id="loginIcon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M10 17l5-5-5-5"
                        ></path>

                        <path
                            d="M15 12H3"
                        ></path>

                        <path
                            d="M21 19V5a2 2 0 0 0-2-2h-6"
                        ></path>

                    </svg>


                    <span id="loginText">
                        Se connecter
                    </span>

                </button>


                <div
                    id="message"
                    class="message"
                ></div>


            </form>


            <div class="card-bottom">

                <div class="bottom-title">
                    De la ferme à l'assiette
                </div>

                <div class="bottom-subtitle">
                    SÉCURITÉ • QUALITÉ • PERFORMANCE
                </div>

            </div>


        </section>

    </main>


    <div
        class="date-time"
        id="dateTime"
    >
        Chargement...
    </div>


    <div class="version">
        v1.0.0
    </div>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script
        src="api/supabase.js"
    ></script>


    <script>

        /* =====================================================
           ELEMENTS
        ===================================================== */

        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const usernameInput =
            document.getElementById(
                "username"
            );

        /* =====================================================
           USERNAME — FORCER LES MAJUSCULES
           IMPORTANT : LE PASSWORD N'EST PAS MODIFIÉ
        ===================================================== */

        usernameInput.addEventListener(
            "input",
            function () {
                const start = this.selectionStart;
                const end = this.selectionEnd;

                this.value = this.value.toUpperCase();

                try {
                    this.setSelectionRange(start, end);
                } catch (e) {
                    // Rien à faire
                }
            }
        );


        const passwordInput =
            document.getElementById(
                "password"
            );

        const rememberInput =
            document.getElementById(
                "remember"
            );

        const togglePassword =
            document.getElementById(
                "togglePassword"
            );

        const eyeIcon =
            document.getElementById(
                "eyeIcon"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const loginIcon =
            document.getElementById(
                "loginIcon"
            );

        const loginText =
            document.getElementById(
                "loginText"
            );

        const message =
            document.getElementById(
                "message"
            );

        const forgotPassword =
            document.getElementById(
                "forgotPassword"
            );

        const dateTime =
            document.getElementById(
                "dateTime"
            );


        /* =====================================================
           DATE / TIME
        ===================================================== */

        function updateDateTime() {

            const now =
                new Date();

            const date =
                now.toLocaleDateString(
                    "fr-FR",
                    {
                        weekday:
                            "long",

                        day:
                            "2-digit",

                        month:
                            "long",

                        year:
                            "numeric"
                    }
                );

            const time =
                now.toLocaleTimeString(
                    "fr-FR",
                    {
                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        second:
                            "2-digit"
                    }
                );

            dateTime.textContent =
                date.charAt(0).toUpperCase() +
                date.slice(1) +
                " | " +
                time;
        }


        updateDateTime();


        setInterval(
            updateDateTime,
            1000
        );


        /* =====================================================
           PASSWORD SHOW / HIDE
        ===================================================== */

        togglePassword.addEventListener(
            "click",
            function () {

                const isPassword =
                    passwordInput.type ===
                    "password";


                if (isPassword) {

                    passwordInput.type =
                        "text";


                    eyeIcon.innerHTML = `

                        <path
                            d="M3 3l18 18"
                        ></path>

                        <path
                            d="M10.58 10.58
                            A2 2 0 0 0
                            13.42 13.42"
                        ></path>

                        <path
                            d="M9.88 4.24
                            A10.94 10.94 0 0 1
                            12 4
                            c7 0 10 8 10 8
                            a18.3 18.3 0 0 1
                            -3.12 4.19"
                        ></path>

                        <path
                            d="M6.61 6.61
                            A18.3 18.3 0 0 0
                            2 12
                            s3 8 10 8
                            a10.94 10.94 0 0 0
                            5.24-1.35"
                        ></path>

                    `;

                    togglePassword.setAttribute(
                        "aria-label",
                        "Masquer le mot de passe"
                    );

                } else {

                    passwordInput.type =
                        "password";


                    eyeIcon.innerHTML = `

                        <path
                            d="M2 12s3.5-7 10-7
                            10 7 10 7-3.5 7-10 7
                            S2 12 2 12z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    `;

                    togglePassword.setAttribute(
                        "aria-label",
                        "Afficher le mot de passe"
                    );
                }

            }
        );


        /* =====================================================
           MESSAGE
        ===================================================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message show " +
                type;
        }


        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "message";
        }


        /* =====================================================
           REMEMBER USERNAME
        ===================================================== */

        const savedUsername =
            localStorage.getItem(
                "smtg_remember_username"
            );


        if (savedUsername) {

            usernameInput.value =
                savedUsername.toUpperCase();

            rememberInput.checked =
                true;
        }


        /* =====================================================
           FORGOT PASSWORD
        ===================================================== */

        forgotPassword.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                showMessage(
                    "Veuillez contacter l'administrateur système.",
                    "info"
                );

            }
        );


        /* =====================================================
           FAILED LOGIN
        ===================================================== */

        async function registerFailedLogin(
            client,
            username,
            reason
        ) {

            try {

                const browser =
                    SMTG.getBrowserInfo();

                const sessionId =
                    SMTG.generateSessionId();


                /* LOGIN HISTORY */

                await client
                    .from("login_history")
                    .insert({

                        user_id:
                            null,

                        username:
                            username,

                        full_name:
                            null,

                        login_at:
                            new Date()
                                .toISOString(),

                        status:
                            "FAILED",

                        ip_address:
                            null,

                        user_agent:
                            browser.userAgent,

                        session_id:
                            sessionId,

                        failure_reason:
                            reason,

                        metadata: {

                            source:
                                "LOGIN",

                            page:
                                "login.html"

                        }

                    });


                /* SYSTEM LOG */

                await SMTG.logSystem({

                    level:
                        "WARNING",

                    source:
                        "AUTHENTICATION",

                    module:
                        "AUTHENTICATION",

                    page:
                        "login.html",

                    event:
                        "LOGIN_FAILED",

                    message:
                        "Échec de connexion",

                    details:
                        reason,

                    metadata: {

                        username:
                            username

                    }

                });

            } catch (error) {

                console.error(
                    "Erreur login failed:",
                    error
                );
            }
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                clearMessage();


                const username =
                    usernameInput.value.trim().toUpperCase();


                const password =
                    passwordInput.value;


                if (
                    !username ||
                    !password
                ) {

                    showMessage(
                        "Veuillez saisir votre nom d'utilisateur et votre mot de passe.",
                        "error"
                    );

                    return;
                }


                /* LOADING */

                loginButton.disabled =
                    true;

                loginText.textContent =
                    "Connexion...";

                loginIcon.style.display =
                    "none";


                const spinner =
                    document.createElement(
                        "span"
                    );

                spinner.className =
                    "spinner";


                loginButton.insertBefore(
                    spinner,
                    loginText
                );


                try {

                    const client =
                        getSupabase();


                    /* =================================================
                       NEW SESSION ID
                    ================================================= */

                    const newSessionId =
                        SMTG.generateSessionId();


                    /* =================================================
                       SECURE LOGIN FUNCTION
                    ================================================= */

                    const {
                        data,
                        error
                    } = await client
                        .rpc(
                            "smtg_login",
                            {

                                p_username:
                                    username,

                                p_password:
                                    password,

                                p_session_id:
                                    newSessionId
                            }
                        );


                    if (error) {

                        console.error(
                            "RPC Login:",
                            error
                        );


                        await SMTG.logError(
                            "LOGIN_RPC_ERROR",
                            error.message,
                            {

                                source:
                                    "AUTHENTICATION",

                                module:
                                    "AUTHENTICATION",

                                page:
                                    "login.html"
                            }
                        );


                        throw error;
                    }


                    /* =================================================
                       RPC RESULT
                    ================================================= */

                    const result =
                        Array.isArray(data)
                            ? data[0]
                            : data;


                    if (!result) {

                        throw new Error(
                            "Réponse Login vide."
                        );
                    }


                    /* =================================================
                       ALREADY CONNECTED
                    ================================================= */

                    if (
                        result.error_code ===
                        "ALREADY_CONNECTED"
                    ) {

                        await registerFailedLogin(
                            client,
                            username,
                            "Utilisateur déjà connecté"
                        );


                        showMessage(
                            "Ce compte est déjà connecté depuis un autre appareil ou emplacement.",
                            "error"
                        );


                        return;
                    }


                    /* =================================================
                       INVALID CREDENTIALS
                    ================================================= */

                    if (
                        !result.success
                    ) {

                        await registerFailedLogin(
                            client,
                            username,
                            result.error_message ||
                                "Identifiants incorrects"
                        );


                        showMessage(
                            result.error_message ||
                                "Nom d'utilisateur ou mot de passe incorrect.",
                            "error"
                        );


                        return;
                    }


                    /* =================================================
                       SAVE USER
                    ================================================= */

                    const sessionUser = {

                        id:
                            result.user_id,

                        username:
                            result.username,

                        full_name:
                            result.full_name,

                        role_id:
                            result.role_id,

                        login_at:
                            new Date()
                                .toISOString(),

                        session_id:
                            result.session_id
                    };


                    sessionStorage.setItem(
                        "smtg_current_user",
                        JSON.stringify(
                            sessionUser
                        )
                    );


                    sessionStorage.setItem(
                        "smtg_session_id",
                        result.session_id
                    );


                    /* =================================================
                       REMEMBER
                    ================================================= */

                    if (
                        rememberInput.checked
                    ) {

                        localStorage.setItem(
                            "smtg_remember_username",
                            username
                        );

                    } else {

                        localStorage.removeItem(
                            "smtg_remember_username"
                        );
                    }


                    /* =================================================
                       LOGIN HISTORY
                       NOTE:
                       smtg_login already created the DB session.
                       Here we only add the history/log records.
                    ================================================= */

                    await SMTG.logLogin({

                        username:
                            result.username,

                        status:
                            "SUCCESS",

                        metadata: {

                            source:
                                "LOGIN",

                            page:
                                "login.html",

                            session_id:
                                result.session_id

                        }

                    });


                    /* =================================================
                       ACTIVITY
                    ================================================= */

                    await SMTG.logActivity({

                        action:
                            "LOGIN",

                        module:
                            "AUTHENTICATION",

                        page:
                            "login.html",

                        page_code:
                            "LOGIN",

                        description:
                            "Connexion utilisateur réussie",

                        entity_type:
                            "USER",

                        entity_id:
                            result.user_id,

                        metadata: {

                            username:
                                result.username,

                            session_id:
                                result.session_id

                        }

                    });


                    /* =================================================
                       SYSTEM LOG
                    ================================================= */

                    await SMTG.logSystem({

                        level:
                            "INFO",

                        source:
                            "AUTHENTICATION",

                        module:
                            "AUTHENTICATION",

                        page:
                            "login.html",

                        event:
                            "LOGIN_SUCCESS",

                        message:
                            "Connexion utilisateur réussie",

                        metadata: {

                            user_id:
                                result.user_id,

                            username:
                                result.username,

                            session_id:
                                result.session_id

                        }

                    });


                    /* =================================================
                       SUCCESS
                    ================================================= */

                    showMessage(
                        "Connexion réussie.",
                        "success"
                    );


                    /* =================================================
                       REDIRECT
                    ================================================= */

                    setTimeout(
                        function () {

                            window.location.href =
                                "index.html";

                        },
                        600
                    );


                } catch (error) {

                    console.error(
                        "Erreur Login:",
                        error
                    );


                    showMessage(
                        "Erreur de connexion au système.",
                        "error"
                    );


                } finally {

                    loginButton.disabled =
                        false;

                    loginText.textContent =
                        "Se connecter";

                    loginIcon.style.display =
                        "block";


                    if (spinner) {

                        spinner.remove();
                    }
                }

            }
        );


        /* =====================================================
           AUTO FOCUS
        ===================================================== */

        if (
            usernameInput.value
        ) {

            passwordInput.focus();

        } else {

            usernameInput.focus();
        }

    </script>

</body>

</html>
