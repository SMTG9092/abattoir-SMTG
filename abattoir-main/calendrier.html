<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SMTG Abattoir - Calendrier</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;

            background: #f4f7fa;
            color: #243b53;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            width: 100%;
            min-height: 100vh;

            padding: 22px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .page-header {

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 18px;
        }

        .title-area {
            min-width: 0;
        }

        .page-title {

            color: #173b5c;

            font-size: 21px;
            font-weight: 700;
        }

        .page-subtitle {

            margin-top: 4px;

            color: #8798a6;

            font-size: 11px;
        }

        .header-actions {

            display: flex;
            align-items: center;

            gap: 8px;

            flex-wrap: wrap;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .btn {

            min-height: 38px;

            padding: 0 14px;

            border: 1px solid #dbe5ec;

            border-radius: 8px;

            background: white;

            color: #49667d;

            font-size: 11px;
            font-weight: 600;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            transition: .2s ease;
        }

        .btn:hover {

            border-color: #bdd3e2;

            background: #f7fafc;
        }

        .btn-primary {

            border-color: #0875c8;

            background: #0875c8;

            color: white;
        }

        .btn-primary:hover {

            border-color: #0667ae;

            background: #0667ae;
        }

        .btn-danger {

            border-color: #f0caca;

            background: #fff6f6;

            color: #c84b4b;
        }

        .btn-danger:hover {

            background: #ffeded;
        }

        .btn svg {

            width: 16px;
            height: 16px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           TOOLBAR
        ===================================================== */

        .toolbar {

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 13px 15px;

            background: white;

            border: 1px solid #e2e9ee;

            border-radius: 10px;

            margin-bottom: 14px;

            box-shadow:
                0 3px 12px
                rgba(25,60,90,.04);
        }

        .toolbar-left,
        .toolbar-right {

            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-box {

            position: relative;

            width: 260px;
        }

        .search-box input {

            width: 100%;

            height: 38px;

            padding:
                0 12px 0 36px;

            border:
                1px solid #dce5eb;

            border-radius: 8px;

            outline: none;

            color: #405b70;

            font-size: 11px;

            background: #fbfcfd;
        }

        .search-box input:focus {

            border-color: #8bbfe0;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(8,117,200,.07);
        }

        .search-icon {

            position: absolute;

            left: 11px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 16px;
            height: 16px;

            color: #8b9daa;

            pointer-events: none;
        }

        .search-icon svg {

            width: 100%;
            height: 100%;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;
        }


        /* =====================================================
           MONTH NAVIGATION
        ===================================================== */

        .month-navigation {

            display: flex;

            align-items: center;

            gap: 7px;
        }

        .month-title {

            min-width: 175px;

            text-align: center;

            color: #244765;

            font-size: 15px;

            font-weight: 700;

            text-transform: capitalize;
        }

        .icon-btn {

            width: 36px;
            height: 36px;

            border:
                1px solid #dce5eb;

            border-radius: 8px;

            background: white;

            color: #5c7487;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {

            background: #f3f8fc;

            border-color: #bdd4e4;

            color: #0875c8;
        }

        .icon-btn svg {

            width: 17px;
            height: 17px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           CALENDAR
        ===================================================== */

        .calendar-card {

            background: white;

            border:
                1px solid #e2e9ee;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 3px 12px
                rgba(25,60,90,.04);
        }

        .week-header {

            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            border-bottom:
                1px solid #e5ebef;

            background: #f8fafc;
        }

        .week-day {

            min-height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #7b8e9d;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;
        }


        .calendar-grid {

            display: grid;

            grid-template-columns:
                repeat(7, 1fr);
        }


        /* =====================================================
           DAY
        ===================================================== */

        .calendar-day {

            min-height: 125px;

            padding: 8px;

            border-right:
                1px solid #edf1f4;

            border-bottom:
                1px solid #edf1f4;

            background: white;

            position: relative;

            cursor: pointer;

            transition: .15s ease;
        }

        .calendar-day:nth-child(7n) {

            border-right: none;
        }

        .calendar-day:hover {

            background: #fbfdff;
        }

        .calendar-day.other-month {

            background: #fafbfc;
        }

        .calendar-day.other-month .day-number {

            color: #b4c0c9;
        }

        .day-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 6px;
        }

        .day-number {

            width: 27px;
            height: 27px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #536d81;

            font-size: 11px;

            font-weight: 700;
        }

        .today .day-number {

            background: #0875c8;

            color: white;

            box-shadow:
                0 3px 8px
                rgba(8,117,200,.25);
        }


        /* =====================================================
           EVENTS
        ===================================================== */

        .events {

            display: flex;

            flex-direction: column;

            gap: 4px;
        }

        .event {

            width: 100%;

            padding:
                5px 6px;

            border-left:
                3px solid #0875c8;

            border-radius: 4px;

            background: #edf6fc;

            color: #35617d;

            font-size: 9px;

            line-height: 1.3;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            cursor: pointer;
        }

        .event:hover {

            background: #e1f0fa;
        }

        .event-time {

            margin-right: 3px;

            color: #6e8799;

            font-weight: 600;
        }

        .event.more {

            border: none;

            background: transparent;

            color: #0875c8;

            padding: 2px 5px;

            font-weight: 700;
        }


        /* =====================================================
           EMPTY
        ===================================================== */

        .calendar-empty {

            padding: 50px 20px;

            text-align: center;

            color: #92a2ae;

            font-size: 11px;
        }


        /* =====================================================
           SEARCH RESULTS
        ===================================================== */

        .search-results {

            display: none;

            margin-bottom: 14px;

            background: white;

            border:
                1px solid #e2e9ee;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 4px 15px
                rgba(25,60,90,.06);
        }

        .search-results.show {

            display: block;
        }

        .search-results-header {

            padding: 11px 14px;

            border-bottom:
                1px solid #edf1f4;

            color: #587185;

            font-size: 10px;

            font-weight: 700;
        }

        .search-result {

            padding: 11px 14px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            border-bottom:
                1px solid #edf1f4;

            cursor: pointer;
        }

        .search-result:last-child {

            border-bottom: none;
        }

        .search-result:hover {

            background: #f7fafc;
        }

        .result-title {

            color: #315772;

            font-size: 11px;

            font-weight: 700;
        }

        .result-date {

            margin-top: 3px;

            color: #8b9ba7;

            font-size: 9px;
        }

        .result-type {

            padding:
                4px 8px;

            border-radius: 20px;

            background: #edf5fb;

            color: #0875c8;

            font-size: 8px;

            font-weight: 700;
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(12,35,55,.42);

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;
        }

        .modal-overlay.show {

            display: flex;
        }

        .modal {

            width: 100%;

            max-width: 480px;

            max-height: 90vh;

            overflow-y: auto;

            background: white;

            border-radius: 13px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.18);
        }

        .modal-header {

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 17px 19px;

            border-bottom:
                1px solid #e8edf1;
        }

        .modal-title {

            color: #244765;

            font-size: 14px;

            font-weight: 700;
        }

        .modal-close {

            width: 31px;
            height: 31px;

            border: none;

            border-radius: 7px;

            background: #f3f6f8;

            color: #718696;

            display: flex;

            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {

            background: #e9eef2;
        }

        .modal-close svg {

            width: 15px;
            height: 15px;

            stroke: currentColor;

            fill: none;

            stroke-width: 2;

            stroke-linecap: round;
        }

        .modal-body {

            padding: 19px;
        }

        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 13px;
        }

        .form-group {

            display: flex;

            flex-direction: column;

            gap: 5px;
        }

        .form-group.full {

            grid-column: 1 / -1;
        }

        .form-label {

            color: #61798a;

            font-size: 9px;

            font-weight: 700;
        }

        .form-control {

            width: 100%;

            min-height: 37px;

            padding: 8px 10px;

            border:
                1px solid #dce5eb;

            border-radius: 7px;

            outline: none;

            background: #fbfcfd;

            color: #38556b;

            font-size: 10px;
        }

        textarea.form-control {

            min-height: 75px;

            resize: vertical;
        }

        .form-control:focus {

            border-color: #8bbfe0;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(8,117,200,.06);
        }

        .modal-footer {

            display: flex;

            justify-content: flex-end;

            gap: 8px;

            padding:
                13px 19px 17px;

            border-top:
                1px solid #edf1f4;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast {

            position: fixed;

            right: 22px;
            bottom: 22px;

            min-width: 260px;

            padding: 12px 15px;

            border-radius: 9px;

            background: #244765;

            color: white;

            font-size: 10px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.16);

            transform:
                translateY(20px);

            opacity: 0;

            pointer-events: none;

            transition: .25s ease;

            z-index: 2000;
        }

        .toast.show {

            transform:
                translateY(0);

            opacity: 1;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            .page-header,
            .toolbar {

                flex-direction: column;

                align-items: stretch;
            }

            .toolbar-left,
            .toolbar-right {

                justify-content: space-between;
            }

            .search-box {

                width: 100%;
            }

            .calendar-day {

                min-height: 105px;
            }

        }

        @media (max-width: 650px) {

            .page {

                padding: 13px;
            }

            .week-day {

                font-size: 8px;
            }

            .calendar-day {

                min-height: 85px;

                padding: 5px;
            }

            .day-number {

                width: 23px;
                height: 23px;

                font-size: 9px;
            }

            .event {

                font-size: 8px;

                padding:
                    4px 4px;
            }

            .month-title {

                min-width: 135px;

                font-size: 13px;
            }

            .form-grid {

                grid-template-columns: 1fr;
            }

            .form-group.full {

                grid-column: auto;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="page-header">

        <div class="title-area">

            <div class="page-title">
                Calendrier
            </div>

            <div class="page-subtitle">
                Planification et gestion des événements
            </div>

        </div>


        <div class="header-actions">

            <button
                class="btn btn-primary"
                id="addEventButton"
            >

                <svg viewBox="0 0 24 24">

                    <path d="M12 5v14"></path>

                    <path d="M5 12h14"></path>

                </svg>

                Nouvel événement

            </button>

        </div>

    </div>


    <!-- =====================================================
         TOOLBAR
    ===================================================== -->

    <div class="toolbar">


        <div class="toolbar-left">


            <div class="search-box">

                <div class="search-icon">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                        ></circle>

                        <path
                            d="M16.5 16.5L21 21"
                        ></path>

                    </svg>

                </div>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="Rechercher un événement..."
                    autocomplete="off"
                >

            </div>


            <button
                class="btn"
                id="todayButton"
            >
                Aujourd'hui
            </button>

        </div>


        <div class="toolbar-right">


            <div class="month-navigation">

                <button
                    class="icon-btn"
                    id="previousMonth"
                    title="Mois précédent"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M15 18l-6-6 6-6"></path>

                    </svg>

                </button>


                <div
                    class="month-title"
                    id="monthTitle"
                >
                    --
                </div>


                <button
                    class="icon-btn"
                    id="nextMonth"
                    title="Mois suivant"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M9 18l6-6-6-6"></path>

                    </svg>

                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SEARCH RESULTS
    ===================================================== -->

    <div
        class="search-results"
        id="searchResults"
    >

        <div class="search-results-header">
            Résultats de recherche
        </div>

        <div id="searchResultsList"></div>

    </div>


    <!-- =====================================================
         CALENDAR
    ===================================================== -->

    <div class="calendar-card">


        <div class="week-header">

            <div class="week-day">Lun</div>
            <div class="week-day">Mar</div>
            <div class="week-day">Mer</div>
            <div class="week-day">Jeu</div>
            <div class="week-day">Ven</div>
            <div class="week-day">Sam</div>
            <div class="week-day">Dim</div>

        </div>


        <div
            class="calendar-grid"
            id="calendarGrid"
        ></div>


    </div>


</div>


<!-- =========================================================
     EVENT MODAL
========================================================= -->

<div
    class="modal-overlay"
    id="modalOverlay"
>


    <div class="modal">


        <div class="modal-header">

            <div
                class="modal-title"
                id="modalTitle"
            >
                Nouvel événement
            </div>


            <button
                class="modal-close"
                id="modalClose"
            >

                <svg viewBox="0 0 24 24">

                    <path d="M6 6l12 12"></path>

                    <path d="M18 6L6 18"></path>

                </svg>

            </button>

        </div>


        <div class="modal-body">


            <div class="form-grid">


                <div class="form-group full">

                    <label class="form-label">
                        Titre *
                    </label>

                    <input
                        class="form-control"
                        id="eventTitle"
                        type="text"
                        maxlength="150"
                        placeholder="Titre de l'événement"
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Date *
                    </label>

                    <input
                        class="form-control"
                        id="eventDate"
                        type="date"
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Heure
                    </label>

                    <input
                        class="form-control"
                        id="eventTime"
                        type="time"
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Type
                    </label>

                    <select
                        class="form-control"
                        id="eventType"
                    >

                        <option value="GENERAL">
                            Général
                        </option>

                        <option value="REUNION">
                            Réunion
                        </option>

                        <option value="PRODUCTION">
                            Production
                        </option>

                        <option value="QUALITE">
                            Qualité
                        </option>

                        <option value="MAINTENANCE">
                            Maintenance
                        </option>

                        <option value="EXPEDITION">
                            Expédition
                        </option>

                        <option value="RH">
                            Ressources humaines
                        </option>

                        <option value="AUTRE">
                            Autre
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Priorité
                    </label>

                    <select
                        class="form-control"
                        id="eventPriority"
                    >

                        <option value="NORMAL">
                            Normale
                        </option>

                        <option value="LOW">
                            Faible
                        </option>

                        <option value="HIGH">
                            Haute
                        </option>

                        <option value="URGENT">
                            Urgente
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        class="form-control"
                        id="eventDescription"
                        maxlength="1000"
                        placeholder="Description..."
                    ></textarea>

                </div>


            </div>

        </div>


        <div class="modal-footer">


            <button
                class="btn btn-danger"
                id="deleteEventButton"
                style="display:none;"
            >
                Supprimer
            </button>


            <div
                style="
                    flex:1;
                "
            ></div>


            <button
                class="btn"
                id="cancelButton"
            >
                Annuler
            </button>


            <button
                class="btn btn-primary"
                id="saveEventButton"
            >
                Enregistrer
            </button>

        </div>


    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    class="toast"
    id="toast"
></div>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
    src="api/supabase.js"
></script>


<script>


    /* =====================================================
       CONFIG
    ===================================================== */

    const SESSION_KEY =
        "smtg_current_user";


    const LOGIN_PAGE =
        "login.html";


    /* =====================================================
       USER
    ===================================================== */

    let currentUser = null;

    const storedUser =
        sessionStorage.getItem(
            SESSION_KEY
        )
        ||
        localStorage.getItem(
            SESSION_KEY
        );


    if (!storedUser) {

        window.location.href =
            LOGIN_PAGE;

    } else {

        try {

            currentUser =
                JSON.parse(
                    storedUser
                );

        } catch (error) {

            console.error(
                "Session invalide:",
                error
            );

            sessionStorage.removeItem(
                SESSION_KEY
            );

            localStorage.removeItem(
                SESSION_KEY
            );

            window.location.href =
                LOGIN_PAGE;

        }

    }


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const calendarGrid =
        document.getElementById(
            "calendarGrid"
        );

    const monthTitle =
        document.getElementById(
            "monthTitle"
        );

    const previousMonth =
        document.getElementById(
            "previousMonth"
        );

    const nextMonth =
        document.getElementById(
            "nextMonth"
        );

    const todayButton =
        document.getElementById(
            "todayButton"
        );

    const searchInput =
        document.getElementById(
            "searchInput"
        );

    const searchResults =
        document.getElementById(
            "searchResults"
        );

    const searchResultsList =
        document.getElementById(
            "searchResultsList"
        );

    const addEventButton =
        document.getElementById(
            "addEventButton"
        );

    const modalOverlay =
        document.getElementById(
            "modalOverlay"
        );

    const modalClose =
        document.getElementById(
            "modalClose"
        );

    const cancelButton =
        document.getElementById(
            "cancelButton"
        );

    const saveEventButton =
        document.getElementById(
            "saveEventButton"
        );

    const deleteEventButton =
        document.getElementById(
            "deleteEventButton"
        );

    const modalTitle =
        document.getElementById(
            "modalTitle"
        );

    const eventTitle =
        document.getElementById(
            "eventTitle"
        );

    const eventDate =
        document.getElementById(
            "eventDate"
        );

    const eventTime =
        document.getElementById(
            "eventTime"
        );

    const eventType =
        document.getElementById(
            "eventType"
        );

    const eventPriority =
        document.getElementById(
            "eventPriority"
        );

    const eventDescription =
        document.getElementById(
            "eventDescription"
        );

    const toast =
        document.getElementById(
            "toast"
        );


    /* =====================================================
       STATE
    ===================================================== */

    let currentDate =
        new Date();

    currentDate.setDate(1);


    let events = [];

    let editingEventId = null;


    /* =====================================================
       SUPABASE CLIENT
    ===================================================== */

    let client = null;

    try {

        client =
            getSupabase();

    } catch (error) {

        console.error(
            "Supabase non disponible:",
            error
        );

    }


    /* =====================================================
       TOAST
    ===================================================== */

    let toastTimer = null;


    function showToast(
        message
    ) {

        toast.textContent =
            message;

        toast.classList.add(
            "show"
        );

        clearTimeout(
            toastTimer
        );

        toastTimer =
            setTimeout(
                function() {

                    toast.classList.remove(
                        "show"
                    );

                },
                2800
            );

    }


    /* =====================================================
       DATE HELPERS
    ===================================================== */

    function pad(
        number
    ) {

        return String(
            number
        ).padStart(
            2,
            "0"
        );

    }


    function formatDateISO(
        date
    ) {

        return (
            date.getFullYear()
            +
            "-"
            +
            pad(
                date.getMonth() + 1
            )
            +
            "-"
            +
            pad(
                date.getDate()
            )
        );

    }


    function parseDate(
        value
    ) {

        const parts =
            String(
                value
            ).split("-");

        if (
            parts.length !== 3
        ) {

            return new Date();

        }

        return new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );

    }


    function formatDisplayDate(
        value
    ) {

        const date =
            parseDate(
                value
            );

        return date.toLocaleDateString(
            "fr-FR",
            {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            }
        );

    }


    /* =====================================================
       MONTH TITLE
    ===================================================== */

    function updateMonthTitle() {

        monthTitle.textContent =
            currentDate.toLocaleDateString(
                "fr-FR",
                {
                    month: "long",
                    year: "numeric"
                }
            );

    }


    /* =====================================================
       LOAD EVENTS
       -----------------------------------------------------
       La page fonctionne aussi sans table :
       dans ce cas le calendrier reste utilisable
       visuellement.
    ===================================================== */

    async function loadEvents() {

        events = [];

        if (!client) {

            renderCalendar();

            return;

        }


        try {

            /*
             * Table prévue :
             * calendar_events
             *
             * Si elle n'existe pas encore,
             * on ne bloque pas la page.
             */

            const {
                data,
                error
            } = await client

                .from(
                    "calendar_events"
                )

                .select(
                    "*"
                )

                .order(
                    "event_date",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.warn(
                    "Table calendar_events non disponible:",
                    error
                );

                events = [];

                renderCalendar();

                return;

            }


            events =
                data || [];


            renderCalendar();


        } catch (error) {

            console.error(
                "Erreur événements:",
                error
            );

            events = [];

            renderCalendar();

        }

    }


    /* =====================================================
       RENDER CALENDAR
    ===================================================== */

    function renderCalendar() {

        updateMonthTitle();

        calendarGrid.innerHTML =
            "";


        const year =
            currentDate.getFullYear();

        const month =
            currentDate.getMonth();


        /*
         * Premier jour du mois.
         *
         * JS:
         * dimanche = 0
         *
         * Nous voulons:
         * lundi = 0
         */

        const firstDay =
            new Date(
                year,
                month,
                1
            );


        let startDay =
            firstDay.getDay();

        startDay =
            startDay === 0
            ?
            6
            :
            startDay - 1;


        const daysInMonth =
            new Date(
                year,
                month + 1,
                0
            ).getDate();


        const previousMonthDays =
            new Date(
                year,
                month,
                0
            ).getDate();


        const totalCells =
            Math.ceil(
                (
                    startDay +
                    daysInMonth
                ) / 7
            ) * 7;


        const today =
            new Date();


        for (
            let index = 0;
            index < totalCells;
            index++
        ) {


            let dayNumber;

            let cellDate;

            let otherMonth =
                false;


            if (
                index < startDay
            ) {

                dayNumber =
                    previousMonthDays
                    -
                    startDay
                    +
                    index
                    +
                    1;


                cellDate =
                    new Date(
                        year,
                        month - 1,
                        dayNumber
                    );


                otherMonth =
                    true;

            } else if (
                index >=
                startDay +
                daysInMonth
            ) {

                dayNumber =
                    index
                    -
                    startDay
                    -
                    daysInMonth
                    +
                    1;


                cellDate =
                    new Date(
                        year,
                        month + 1,
                        dayNumber
                    );


                otherMonth =
                    true;

            } else {

                dayNumber =
                    index
                    -
                    startDay
                    +
                    1;


                cellDate =
                    new Date(
                        year,
                        month,
                        dayNumber
                    );

            }


            const dateISO =
                formatDateISO(
                    cellDate
                );


            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "calendar-day";


            if (
                otherMonth
            ) {

                cell.classList.add(
                    "other-month"
                );

            }


            /*
             * Today
             */

            if (
                cellDate.getFullYear()
                ===
                today.getFullYear()
                &&
                cellDate.getMonth()
                ===
                today.getMonth()
                &&
                cellDate.getDate()
                ===
                today.getDate()
            ) {

                cell.classList.add(
                    "today"
                );

            }


            cell.innerHTML = `

                <div class="day-header">

                    <div class="day-number">
                        ${dayNumber}
                    </div>

                </div>

                <div
                    class="events"
                    data-date="${dateISO}"
                ></div>

            `;


            /*
             * Double click = nouvel événement
             */

            cell.addEventListener(
                "dblclick",
                function() {

                    openCreateModal(
                        dateISO
                    );

                }
            );


            /*
             * Click sur cellule vide
             */

            cell.addEventListener(
                "click",
                function(event) {

                    if (
                        event.target === cell
                        ||
                        event.target.classList.contains(
                            "day-header"
                        )
                        ||
                        event.target.classList.contains(
                            "day-number"
                        )
                    ) {

                        /*
                         * Simple clic :
                         * rien de plus.
                         *
                         * Double clic permet
                         * la création.
                         */

                    }

                }
            );


            calendarGrid.appendChild(
                cell
            );


            /*
             * Events
             */

            const dayEvents =
                events.filter(
                    function(item) {

                        return String(
                            item.event_date
                            ||
                            item.date
                            ||
                            ""
                        ).slice(0, 10)
                        ===
                        dateISO;

                    }
                );


            const eventsContainer =
                cell.querySelector(
                    ".events"
                );


            const maxEvents =
                3;


            dayEvents
                .slice(
                    0,
                    maxEvents
                )
                .forEach(
                    function(item) {

                        const event =
                            document.createElement(
                                "div"
                            );


                        event.className =
                            "event";


                        const time =
                            item.event_time
                            ||
                            item.time
                            ||
                            "";


                        const title =
                            item.title
                            ||
                            item.event_title
                            ||
                            "Événement";


                        event.innerHTML = `

                            ${
                                time
                                ?
                                `<span class="event-time">${escapeHtml(time)}</span>`
                                :
                                ""
                            }

                            ${escapeHtml(title)}

                        `;


                        event.addEventListener(
                            "click",
                            function(e) {

                                e.stopPropagation();

                                openEditModal(
                                    item
                                );

                            }
                        );


                        eventsContainer.appendChild(
                            event
                        );

                    }
                );


            if (
                dayEvents.length >
                maxEvents
            ) {

                const more =
                    document.createElement(
                        "div"
                    );


                more.className =
                    "event more";


                more.textContent =
                    "+"
                    +
                    (
                        dayEvents.length
                        -
                        maxEvents
                    )
                    +
                    " autres";


                eventsContainer.appendChild(
                    more
                );

            }

        }

    }


    /* =====================================================
       ESCAPE
    ===================================================== */

    function escapeHtml(
        value
    ) {

        return String(
            value || ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    /* =====================================================
       OPEN CREATE
    ===================================================== */

    function openCreateModal(
        date
    ) {

        editingEventId =
            null;


        modalTitle.textContent =
            "Nouvel événement";


        eventTitle.value =
            "";


        eventDate.value =
            date
            ||
            formatDateISO(
                new Date()
            );


        eventTime.value =
            "";


        eventType.value =
            "GENERAL";


        eventPriority.value =
            "NORMAL";


        eventDescription.value =
            "";


        deleteEventButton.style.display =
            "none";


        modalOverlay.classList.add(
            "show"
        );


        setTimeout(
            function() {

                eventTitle.focus();

            },
            100
        );

    }


    /* =====================================================
       OPEN EDIT
    ===================================================== */

    function openEditModal(
        item
    ) {

        editingEventId =
            item.id;


        modalTitle.textContent =
            "Modifier l'événement";


        eventTitle.value =
            item.title
            ||
            item.event_title
            ||
            "";


        eventDate.value =
            String(
                item.event_date
                ||
                item.date
                ||
                ""
            ).slice(
                0,
                10
            );


        eventTime.value =
            item.event_time
            ||
            item.time
            ||
            "";


        eventType.value =
            item.event_type
            ||
            item.type
            ||
            "GENERAL";


        eventPriority.value =
            item.priority
            ||
            "NORMAL";


        eventDescription.value =
            item.description
            ||
            "";


        deleteEventButton.style.display =
            "inline-flex";


        modalOverlay.classList.add(
            "show"
        );

    }


    /* =====================================================
       CLOSE MODAL
    ===================================================== */

    function closeModal() {

        modalOverlay.classList.remove(
            "show"
        );

        editingEventId =
            null;

    }


    /* =====================================================
       SAVE EVENT
    ===================================================== */

    async function saveEvent() {

        const title =
            eventTitle.value.trim();


        const date =
            eventDate.value;


        if (!title) {

            showToast(
                "Veuillez saisir le titre de l'événement."
            );

            eventTitle.focus();

            return;

        }


        if (!date) {

            showToast(
                "Veuillez sélectionner une date."
            );

            eventDate.focus();

            return;

        }


        if (!client) {

            showToast(
                "Connexion Supabase indisponible."
            );

            return;

        }


        saveEventButton.disabled =
            true;


        try {


            const payload = {

                title:
                    title,

                event_date:
                    date,

                event_time:
                    eventTime.value
                    ||
                    null,

                event_type:
                    eventType.value,

                priority:
                    eventPriority.value,

                description:
                    eventDescription.value.trim()
                    ||
                    null,

                user_id:
                    currentUser
                    ?
                    Number(currentUser.id)
                    :
                    null,

                username:
                    currentUser
                    ?
                    currentUser.username
                    :
                    null,

                updated_at:
                    new Date().toISOString()

            };


            if (
                editingEventId
            ) {


                const {
                    error
                } = await client

                    .from(
                        "calendar_events"
                    )

                    .update(
                        payload
                    )

                    .eq(
                        "id",
                        editingEventId
                    );


                if (error) {

                    throw error;

                }


                showToast(
                    "Événement modifié."
                );


            } else {


                payload.created_at =
                    new Date().toISOString();


                const {
                    error
                } = await client

                    .from(
                        "calendar_events"
                    )

                    .insert(
                        payload
                    );


                if (error) {

                    throw error;

                }


                showToast(
                    "Événement ajouté."
                );

            }


            closeModal();

            await loadEvents();


            /*
             * Log
             */

            try {

                if (
                    window.SMTG &&
                    typeof window.SMTG.logActivity
                    ===
                    "function"
                ) {

                    await window.SMTG.logActivity(
                        editingEventId
                        ?
                        "UPDATE"
                        :
                        "CREATE",
                        "GENERAL",
                        "calendar.html",
                        editingEventId
                        ?
                        "Modification événement"
                        :
                        "Création événement",
                        "CALENDAR_EVENT",
                        editingEventId,
                        {
                            title:
                                title,

                            event_date:
                                date
                        }
                    );

                }

            } catch (logError) {

                console.warn(
                    "Log activité:",
                    logError
                );

            }


        } catch (error) {

            console.error(
                "Erreur sauvegarde événement:",
                error
            );


            showToast(
                "Impossible d'enregistrer l'événement."
            );


        } finally {

            saveEventButton.disabled =
                false;

        }

    }


    /* =====================================================
       DELETE EVENT
    ===================================================== */

    async function deleteEvent() {

        if (
            !editingEventId
        ) {

            return;

        }


        const confirmed =
            confirm(
                "Voulez-vous vraiment supprimer cet événement ?"
            );


        if (!confirmed) {

            return;

        }


        if (!client) {

            showToast(
                "Connexion Supabase indisponible."
            );

            return;

        }


        deleteEventButton.disabled =
            true;


        try {

            const {
                error
            } = await client

                .from(
                    "calendar_events"
                )

                .delete()

                .eq(
                    "id",
                    editingEventId
                );


            if (error) {

                throw error;

            }


            showToast(
                "Événement supprimé."
            );


            closeModal();

            await loadEvents();


            try {

                if (
                    window.SMTG &&
                    typeof window.SMTG.logActivity
                    ===
                    "function"
                ) {

                    await window.SMTG.logActivity(
                        "DELETE",
                        "GENERAL",
                        "calendar.html",
                        "Suppression événement",
                        "CALENDAR_EVENT",
                        editingEventId
                    );

                }

            } catch (logError) {

                console.warn(
                    "Log activité:",
                    logError
                );

            }


        } catch (error) {

            console.error(
                "Erreur suppression:",
                error
            );


            showToast(
                "Impossible de supprimer l'événement."
            );


        } finally {

            deleteEventButton.disabled =
                false;

        }

    }


    /* =====================================================
       SEARCH
    ===================================================== */

    function searchEvents(
        value
    ) {

        const search =
            String(
                value || ""
            )
            .trim()
            .toLowerCase();


        if (!search) {

            searchResults.classList.remove(
                "show"
            );

            return;

        }


        const results =
            events.filter(
                function(item) {

                    const title =
                        String(
                            item.title
                            ||
                            item.event_title
                            ||
                            ""
                        )
                        .toLowerCase();


                    return title.includes(
                        search
                    );

                }
            );


        searchResultsList.innerHTML =
            "";


        searchResults.classList.add(
            "show"
        );


        if (
            results.length === 0
        ) {

            searchResultsList.innerHTML = `

                <div class="calendar-empty">
                    Aucun événement trouvé.
                </div>

            `;

            return;

        }


        results.forEach(
            function(item) {


                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "search-result";


                const title =
                    item.title
                    ||
                    item.event_title
                    ||
                    "Événement";


                const date =
                    item.event_date
                    ||
                    item.date
                    ||
                    "";


                const type =
                    item.event_type
                    ||
                    item.type
                    ||
                    "GENERAL";


                row.innerHTML = `

                    <div>

                        <div class="result-title">
                            ${escapeHtml(title)}
                        </div>

                        <div class="result-date">
                            ${escapeHtml(
                                formatDisplayDate(
                                    String(date).slice(0,10)
                                )
                            )}
                        </div>

                    </div>

                    <div class="result-type">
                        ${escapeHtml(type)}
                    </div>

                `;


                row.addEventListener(
                    "click",
                    function() {

                        openEditModal(
                            item
                        );

                    }
                );


                searchResultsList.appendChild(
                    row
                );

            }
        );

    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    previousMonth.addEventListener(
        "click",
        async function() {

            currentDate.setMonth(
                currentDate.getMonth() - 1
            );

            renderCalendar();

        }
    );


    nextMonth.addEventListener(
        "click",
        async function() {

            currentDate.setMonth(
                currentDate.getMonth() + 1
            );

            renderCalendar();

        }
    );


    todayButton.addEventListener(
        "click",
        function() {

            const now =
                new Date();


            currentDate =
                new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    1
                );


            renderCalendar();

        }
    );


    /* =====================================================
       MODAL EVENTS
    ===================================================== */

    addEventButton.addEventListener(
        "click",
        function() {

            openCreateModal(
                formatDateISO(
                    new Date()
                )
            );

        }
    );


    modalClose.addEventListener(
        "click",
        closeModal
    );


    cancelButton.addEventListener(
        "click",
        closeModal
    );


    modalOverlay.addEventListener(
        "click",
        function(event) {

            if (
                event.target ===
                modalOverlay
            ) {

                closeModal();

            }

        }
    );


    saveEventButton.addEventListener(
        "click",
        saveEvent
    );


    deleteEventButton.addEventListener(
        "click",
        deleteEvent
    );


    searchInput.addEventListener(
        "input",
        function() {

            searchEvents(
                searchInput.value
            );

        }
    );


    /* =====================================================
       ESCAPE KEY
    ===================================================== */

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
                &&
                modalOverlay.classList.contains(
                    "show"
                )
            ) {

                closeModal();

            }

        }
    );


    /* =====================================================
       INITIALIZE
    ===================================================== */

    async function initialize() {

        if (!currentUser) {

            return;

        }


        renderCalendar();

        await loadEvents();

    }


    initialize();


</script>


</body>
